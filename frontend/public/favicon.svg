<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="applyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#0072FF" />
      <stop offset="100%" stop-color="#7C4DFF" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Glow Ring Sphere -->
  <circle cx="50" cy="50" r="44" fill="#080911" stroke="url(#applyGrad)" stroke-width="4" filter="url(#glowEffect)" />
  <!-- Inner Sphere Grid Lines -->
  <ellipse cx="50" cy="50" rx="44" ry="18" fill="none" stroke="url(#applyGrad)" stroke-width="1.5" opacity="0.4" />
  <ellipse cx="50" cy="50" rx="18" ry="44" fill="none" stroke="url(#applyGrad)" stroke-width="1.5" opacity="0.4" />
  <!-- Central 'A' Stylized Apply Arrow Node -->
  <path d="M 50,22 L 72,74 L 60,74 L 54,60 L 46,60 L 40,74 L 28,74 Z M 50,38 L 43,53 L 57,53 Z" fill="url(#applyGrad)" filter="url(#glowEffect)" />
  <!-- Top Orb Spark -->
  <circle cx="50" cy="22" r="4" fill="#00E5FF" />
</svg>
