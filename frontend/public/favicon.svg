<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="zoraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#7C4DFF" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#E040FB" />
      <stop offset="100%" stop-color="#FFD600" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield Hexagon -->
  <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" fill="#0a0b12" stroke="url(#zoraGrad)" stroke-width="4" filter="url(#glow)" />
  <!-- Inner Neural Network Circuit Lines -->
  <path d="M 50,18 L 50,42 M 25,65 L 50,50 M 75,65 L 50,50" stroke="url(#zoraGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <!-- Central Glowing Lightning Spark / Z Energy Node -->
  <path d="M 54,24 L 36,52 L 48,52 L 44,76 L 64,46 L 52,46 Z" fill="url(#sparkGrad)" filter="url(#glow)" />
  <!-- Outer Connection Nodes -->
  <circle cx="50" cy="18" r="4" fill="#00E5FF" />
  <circle cx="25" cy="65" r="4" fill="#E040FB" />
  <circle cx="75" cy="65" r="4" fill="#00E5FF" />
</svg>
