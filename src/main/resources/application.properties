spring.application.name=Analyzer

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=${PORT:8081}

# MySQL Config
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ats}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:java}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT config
jwt.secret=${JWT_SECRET}

rapidapi.key=${RAPIDAPI_KEY}
rapidapi.host=${RAPIDAPI_HOST:jobs-api14.p.rapidapi.com}

openwebninja.api-key=${OPENWEBNINJA_API_KEY}
openwebninja.base-url=${OPENWEBNINJA_BASE_URL:https://api.openwebninja.com/realtime-glassdoor-data/job-search}

# Mistral AI Config (Using OpenAI format)
spring.ai.openai.api-key=${MISTRAL_API_KEY}
spring.ai.openai.base-url=${MISTRAL_BASE_URL:https://api.mistral.ai}
spring.ai.openai.chat.options.model=${MISTRAL_MODEL:mistral-small-latest}

# Groq AI Config
groq.api.key=${GROQ_API_KEY}
groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1/chat/completions}
groq.model=${GROQ_MODEL:groq/compound-mini}

# Zenserp Config
zenserp.key=${ZENSERP_KEY}
